name: Windows 검사 및 배포 파일 준비
on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    name: 실행 파일 빌드와 품질 검사
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 고정 버전 빌드 의존성 설치
        run: python -m pip install -r requirements-lock.txt
      - name: 앱 버전과 배포 태그 일치 확인
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python -c "import os; from app_info import VERSION; assert os.environ['RELEASE_TAG'] == 'v' + VERSION, '버전과 태그가 일치하지 않습니다'"
      - name: 자동 검사 및 실행 파일 생성
        run: python -X utf8 build_release.py
      - name: 실제 WebView2 화면과 저장 연결 검사
        run: |
          $probe = Join-Path $env:RUNNER_TEMP 'gunsu-ui-probe'
          $process = Start-Process -FilePath '.\dist\GunsuSchedule.exe' -ArgumentList @('--ui-smoke-test', ('"' + $probe + '"')) -WindowStyle Hidden -PassThru
          if (-not $process.WaitForExit(90000)) { throw 'WebView2 화면 점검 시간 초과' }
          $report = Get-Content -LiteralPath (Join-Path $probe 'ui-smoke-result.json') -Raw | ConvertFrom-Json
          if (-not $report.success) { throw 'WebView2 브릿지 점검 실패' }
      - uses: actions/upload-artifact@v4
        with:
          name: GunsuSchedule-Windows
          path: |
            dist/GunsuSchedule.exe
            release/GunsuSchedule-v*-Windows.zip
            release/SHA256SUMS.txt
            release/release-manifest.json
            release/RELEASE_NOTES.txt
  draft-release:
    name: 한글 설명을 포함한 배포 초안 생성
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: GunsuSchedule-Windows
          path: artifacts
      - name: 검토용 GitHub 릴리즈 초안 작성
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" --repo "$REPOSITORY" --draft --verify-tag \
            --notes-file artifacts/release/RELEASE_NOTES.txt --title "군수실 일정 관리 $RELEASE_TAG" \
            artifacts/dist/GunsuSchedule.exe "artifacts/release/GunsuSchedule-${RELEASE_TAG}-Windows.zip" \
            artifacts/release/SHA256SUMS.txt artifacts/release/release-manifest.json
