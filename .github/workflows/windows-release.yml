name: Windows 검사 및 배포 파일 준비
on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    name: 실행 파일 빌드와 품질 검사
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 고정 버전 빌드 의존성 설치
        run: python -m pip install -r requirements-lock.txt
      - name: 앱 버전과 배포 태그 일치 확인
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python -c "import os; from app_info import VERSION; assert os.environ['RELEASE_TAG'] == 'v' + VERSION, '버전과 태그가 일치하지 않습니다'"
      - name: 자동 검사 및 실행 파일 생성
        run: python -X utf8 build_release.py
      - name: 실제 WebView2 화면과 저장 연결 검사
        run: |
          $probe = Join-Path $env:RUNNER_TEMP 'gunsu-ui-probe'
          $process = Start-Process -FilePath '.\dist\군수실 일정 관리 설치.exe' -ArgumentList @('--ui-smoke-test', ('"' + $probe + '"')) -WindowStyle Hidden -PassThru
          if (-not $process.WaitForExit(90000)) { throw 'WebView2 화면 점검 시간 초과' }
          $report = Get-Content -LiteralPath (Join-Path $probe 'ui-smoke-result.json') -Raw | ConvertFrom-Json
          if (-not $report.success) { throw 'WebView2 브릿지 점검 실패' }
      - name: 한글 설치 파일에서 설치·재실행·바로가기 전환 검사
        run: |
          $probe = Join-Path $env:RUNNER_TEMP 'gunsu-install-probe'
          $reportPath = Join-Path $probe 'ui-smoke-result.json'
          Start-Process -FilePath '.\dist\군수실 일정 관리 설치.exe' -ArgumentList @('--install-smoke-test', ('"' + $probe + '"')) -WindowStyle Hidden
          $deadline = (Get-Date).AddSeconds(90)
          while (-not (Test-Path -LiteralPath $reportPath)) {
            if ((Get-Date) -ge $deadline) { throw '설치·재실행 점검 시간 초과' }
            Start-Sleep -Seconds 1
          }
          $report = Get-Content -LiteralPath $reportPath -Raw -Encoding UTF8 | ConvertFrom-Json
          if (-not $report.success -or -not $report.installedLaunch) { throw '설치·바로가기 전환 점검 실패' }
      - name: 구버전 앱 내 업데이트 감시·데이터 보존·재실행 회귀 검사
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $legacy = Join-Path $env:RUNNER_TEMP 'gunsu-legacy'
          gh release download v2.1.4 --repo '${{ github.repository }}' --pattern GunsuSchedule.exe --dir $legacy
          foreach ($scenario in @('valid', 'fixture', 'corrupt')) {
            python -X utf8 tools/verify_in_app_update.py --previous-exe (Join-Path $legacy 'GunsuSchedule.exe') --current-exe '.\dist\군수실 일정 관리 설치.exe' --root (Join-Path $env:RUNNER_TEMP ('gunsu-update-' + $scenario)) --scenario $scenario
            if ($LASTEXITCODE -ne 0) { throw ('앱 내 업데이트 검사 실패: ' + $scenario) }
          }
          $caseIndex = 0
          foreach ($entry in @('GunsuSchedule.exe', '군수실 일정 관리.exe', '아버지 일정 (최종).exe')) {
            foreach ($label in @('군수실 일정 관리.lnk', '아버지 일정.lnk')) {
              $caseIndex++
              python -X utf8 tools/verify_in_app_update.py --previous-exe (Join-Path $legacy 'GunsuSchedule.exe') --current-exe '.\dist\군수실 일정 관리 설치.exe' --root (Join-Path $env:RUNNER_TEMP ('gunsu-update-rename-' + $caseIndex)) --scenario valid --entry-name $entry --shortcut-name $label
              if ($LASTEXITCODE -ne 0) { throw ('이름 변경 이전 검사 실패: ' + $caseIndex) }
            }
          }
          foreach ($scenario in @('valid', 'corrupt')) {
            python -X utf8 tools/verify_in_app_update.py --previous-exe (Join-Path $legacy 'GunsuSchedule.exe') --current-exe '.\dist\군수실 일정 관리 설치.exe' --root (Join-Path $env:RUNNER_TEMP ('gunsu-update-fixed-' + $scenario)) --scenario $scenario --monitor fixed
            if ($LASTEXITCODE -ne 0) { throw ('고정 실행기 업데이트 검사 실패: ' + $scenario) }
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: GunsuSchedule-검사기록
          path: |
            build/bundle-probe-*/smoke-*.json
            ${{ runner.temp }}/gunsu-ui-probe/ui-smoke-result.json
            ${{ runner.temp }}/gunsu-ui-probe/data/application.log
            ${{ runner.temp }}/gunsu-install-probe/ui-smoke-result.json
            ${{ runner.temp }}/gunsu-install-probe/data/application.log
            ${{ runner.temp }}/gunsu-update-*/in-app-update-result.json
            ${{ runner.temp }}/gunsu-update-*/update-ui-result.json
            ${{ runner.temp }}/gunsu-update-*/ui-smoke-result.json
            ${{ runner.temp }}/gunsu-update-*/data/application.log
            ${{ runner.temp }}/gunsu-update-*/launcher-*.json
            ${{ runner.temp }}/gunsu-update-*/installed/updates/desktop-migration.json
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: GunsuSchedule-Windows
          path: |
            dist/군수실 일정 관리 설치.exe
            dist/GunsuSchedule.exe
            release/군수실 일정 관리-v*-Windows.zip
            release/SHA256SUMS.txt
            release/release-manifest.json
            release/RELEASE_NOTES.txt
  draft-release:
    name: 한글 설명을 포함한 배포 초안 생성
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: GunsuSchedule-Windows
          path: artifacts
      - name: 검토용 GitHub 릴리즈 초안 작성
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          # GitHub strips Korean upload filenames; retain them inside the ZIP.
          published_zip="artifacts/release/GunsuSchedule-${RELEASE_TAG}-Windows.zip"
          cp "artifacts/release/군수실 일정 관리-${RELEASE_TAG}-Windows.zip" "$published_zip"
          python - "$published_zip" <<'PY'
          from pathlib import Path
          import hashlib, json, sys
          archive = Path(sys.argv[1])
          executable = Path('artifacts/dist/GunsuSchedule.exe')
          manifest = Path('artifacts/release/release-manifest.json')
          data = json.loads(manifest.read_text('utf-8'))
          data['installer'] = data['asset']
          data['asset'] = executable.name
          data['localZip'] = data['zip']
          data['zip'] = archive.name
          data.pop('compatibilityAsset', None)
          manifest.write_text(json.dumps(data, ensure_ascii=False, indent=2), 'utf-8')
          Path('artifacts/release/SHA256SUMS.txt').write_text(''.join(
              hashlib.sha256(path.read_bytes()).hexdigest() + '  ' + path.name + '\n'
              for path in (executable, archive)), 'utf-8')
          PY
          gh release create "$RELEASE_TAG" --repo "$REPOSITORY" --draft --verify-tag \
            --notes-file artifacts/release/RELEASE_NOTES.txt --title "군수실 일정 관리 $RELEASE_TAG" \
            "artifacts/dist/GunsuSchedule.exe#앱 내 업데이트용 (직접 실행보다 ZIP 권장)" \
            "${published_zip}#군수실 일정 관리 ${RELEASE_TAG} (ZIP · 권장)" \
            artifacts/release/SHA256SUMS.txt artifacts/release/release-manifest.json
